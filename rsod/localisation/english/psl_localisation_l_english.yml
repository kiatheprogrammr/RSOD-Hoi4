l_english:
 PSL_Militarized_state: "Militarized State"
 PSL_Militarized_state_desc: "Following the catastrophic defeat at Warsaw and Tukhachevsky's brutal occupation, the state on Silesian soil ceased all conventional civilian functions. Society, industry, and the remnant administration are now entirely geared toward total warfare and impending reconquest. While this martial doctrine severely destabilizes domestic life, it has forged a resilient force ready for immediate mobilization."
 PSL_Exiled_government: "Exiled Government"
 PSL_Exiled_government_desc: "Forced into exile to Upper Silesia in 1921, the legitimate Polish government rules over a fraction of its former territory. Internal political friction, administrative paralysis, and the loss of the capital hamper day-to-day governance. Yet, despite operating under a severe crisis of authority, its continued existence serves as a beacon of resistance, proving that free Poland has not surrendered."
 PSL_Partisan_Network: "Partisant Network"
 PSL_Partisan_Network_desc: "Years of underground operations, covert German funding, and relentless sabotage have turned the majority of the population into a sprawling resistance movement. Leveraging captured weaponry and deeply embedded partisan cells, the exile government can mobilize vast manpower at a moment's notice, inflicting constant havoc on the puppet PRL regime in Warsaw."