 Social_Democracy: "Social Democracy"
 Social_Democracy_desc: "§Y Social liberalism combined individual freedom and free markets with social reforms. It supported democracy, civil rights, welfare programs, and government action to reduce poverty and inequality while maintaining private property and personal freedoms. §!"
 
 Liberalism: "Liberalism"
 Liberalism_desc: "§C Liberalism emphasized individual freedom, private property, free markets, democracy, and limited government intervention in the economy. Liberals generally supported civil rights, constitutional government, and political freedoms. §!"
 
 Conservatism: "Conservatism"
 Conservatism_desc: "§C Conservatism emphasized tradition, social stability, national institutions, private property, and gradual rather than revolutionary change. Conservatives generally supported established political and social structures and opposed radical movements that threatened them. §!"
 
